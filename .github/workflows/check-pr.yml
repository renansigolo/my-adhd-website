# Check PR for issues with Code Style
---
name: Check PR

on: pull_request

concurrency:
  group: check-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check_code_style:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure Vercel CLI Environments
        run: |
          npm install --global vercel@latest
          vercel pull --environment=preview --non-interactive --scope=renan-sigolo --token=${{ secrets.VERCEL_TOKEN }}
          vercel env pull --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Check Format
        run: npm run fmt:check

      - name: Check Lint
        run: npm run lint

      - name: Check Build
        run: npm run build
